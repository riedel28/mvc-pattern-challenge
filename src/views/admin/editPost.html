{% extends "_baseLayout.html" %}

{% block page_header %}
  <header
    class="masthead"
    style="background-image: url('assets/img/post-bg.jpg')"
  >
    <div class="container position-relative px-4 px-lg-5">
      <div class="row gx-4 gx-lg-5 justify-content-center">
        <div class="col-md-10 col-lg-8 col-xl-7">
          <div class="page-heading">
            <h1>Edit Post</h1>
            <span class="subheading">Update this article.</span>
          </div>
        </div>
      </div>
    </div>
  </header>
{% endblock page_header %}

{% block main_content %}
  <main class="mb-4">
    <div class="container px-4 px-lg-5">
      <div class="row gx-4 gx-lg-5 justify-content-center">
        <div class="col-md-10 col-lg-8 col-xl-7">
          <p class="mb-4">
            <a href="/admin">← Back to admin</a>
          </p>
          <form
            action="/admin/posts/{{ slug }}"
            method="post"
            class="my-5"
          >
            <div class="form-floating mb-3">
              <input
                class="form-control"
                id="title"
                name="title"
                type="text"
                placeholder="Title"
                value="{{ post.title }}"
                required
              />
              <label for="title">Title</label>
            </div>
            <div class="form-floating mb-3">
              <input
                class="form-control"
                id="image"
                name="image"
                type="text"
                placeholder="Image filename"
                value="{{ post.image }}"
              />
              <label for="image">Image (filename)</label>
            </div>
            <div class="form-floating mb-3">
              <input
                class="form-control"
                id="author"
                name="author"
                type="text"
                placeholder="Author"
                value="{{ post.author }}"
              />
              <label for="author">Author</label>
            </div>
            <div class="form-floating mb-3">
              <textarea
                class="form-control"
                id="teaser"
                name="teaser"
                placeholder="Teaser"
                style="height: 6rem"
              >{{ post.teaser }}</textarea>
              <label for="teaser">Teaser</label>
            </div>
            <div class="form-floating mb-4">
              <textarea
                class="form-control"
                id="content"
                name="content"
                placeholder="Content"
                style="height: 12rem"
                required
              >{{ post.content }}</textarea>
              <label for="content">Content</label>
            </div>
            <button class="btn btn-primary text-uppercase" type="submit">
              Save changes
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>
{% endblock main_content %}
